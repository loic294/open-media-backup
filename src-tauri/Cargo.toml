[package]
name = "open-media-backup"
version = "0.1.0"
description = "Track and verify media backups from memory cards to final storage"
edition = "2021"

[lib]
name = "omb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
blake3 = "1"
globset = "0.4"
regex = "1"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
sysinfo = "0.37"
gethostname = "1"
plist = "1"
parking_lot = "0.12"
log = "0.4"
jpeg-decoder = { version = "0.3", default-features = false }
kamadak-exif = "0.6"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
keepawake = "0.6.1"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[profile.release]
lto = true
codegen-units = 1

# Image decoding is ~20x slower unoptimized; keep dependencies fast in `tauri dev`.
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false
